name: PoWorks validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poworks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate dashboard JavaScript syntax
        run: node --check "PoWorks Rework/wwwroot/js/energy-dashboard.js"

      - name: Restore application
        run: dotnet restore "PoWorks Rework/PoWorks Rework.csproj"

      - name: Build application
        run: dotnet build "PoWorks Rework/PoWorks Rework.csproj" --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore "PoWorks Rework.Tests/PoWorks Rework.Tests.csproj"

      - name: Run full regression suite
        env:
          POWORKS_TEST_POSTGRES: Host=localhost;Port=5432;Database=poworks_test;Username=postgres;Password=postgres;SSL Mode=Disable
        run: dotnet test "PoWorks Rework.Tests/PoWorks Rework.Tests.csproj" --configuration Release --no-restore --verbosity normal
